<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 코딩 복습 퀴즈</title>
  <meta name="description" content="바이브 코딩 강의 복습 퀴즈 - 난이도(상·중·하)와 문제 유형(객관식·단답형)을 골라 풀어 보세요">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf8ef;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #4a4a4a;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-soft: #eff4ff;
      --border: #cfc8b8;
      --correct-bg: #dcfce7;
      --correct: #166534;
      --wrong-bg: #fee2e2;
      --wrong: #991b1b;
      --focus: #f59e0b;
      --scale: 1;
    }

    * { box-sizing: border-box; }

    html { font-size: calc(22px * var(--scale)); }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* 상단 바: 제목 + 글자 크기 조절 */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .topbar h1 { font-size: 1.4rem; margin: 0; font-weight: 900; }
    .size-controls { display: flex; gap: 8px; align-items: center; }
    .size-controls span { font-size: 0.8rem; color: var(--muted); }
    .size-btn {
      min-width: 56px;
      min-height: 48px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.06);
    }

    /* 시작 화면: 난이도·유형 선택 */
    .setting { margin-top: 24px; text-align: left; }
    .setting h3 { font-size: 1.15rem; margin: 0 0 10px; }
    .choice-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .choice {
      min-height: 84px;
      padding: 10px 8px;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--text);
      background: #fff;
      border: 3px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      line-height: 1.3;
    }
    .choice small { display: block; font-size: 0.75rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
    .choice[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: #fff;
    }
    .choice[aria-pressed="true"] small { color: #dbe4ff; }

    /* 진행 표시 */
    .progress-text {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    .badge {
      font-size: 0.8rem;
      padding: 2px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      border: 2px solid var(--primary);
    }
    .progress-bar {
      height: 16px;
      background: #e8e1d2;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-fill { height: 100%; background: var(--primary); width: 0; transition: width 0.4s; }

    .question { font-size: 1.3rem; font-weight: 700; margin: 0 0 24px; }

    /* 객관식 보기 */
    .options { display: grid; gap: 14px; }
    .option {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 72px;
      padding: 14px 18px;
      font: inherit;
      font-size: 1.1rem;
      text-align: left;
      color: var(--text);
      background: #fff;
      border: 3px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .option:hover:not(:disabled), .choice:hover { border-color: var(--primary); }
    .option:hover:not(:disabled) { background: var(--primary-soft); }
    .option:focus-visible, .btn:focus-visible, .size-btn:focus-visible,
    .choice:focus-visible, .answer-input:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }
    .option .num {
      flex: 0 0 auto;
      width: 48px; height: 48px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: #e8e1d2;
      font-weight: 900;
    }
    .option:disabled { cursor: default; }
    .option.correct { background: var(--correct-bg); border-color: var(--correct); }
    .option.correct .num { background: var(--correct); color: #fff; }
    .option.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
    .option.wrong .num { background: var(--wrong); color: #fff; }
    .option.dim { opacity: 0.6; }

    /* 단답형 입력 */
    .short-box label { display: block; font-weight: 700; margin-bottom: 8px; }
    .answer-input {
      width: 100%;
      min-height: 72px;
      padding: 12px 18px;
      font: inherit;
      font-size: 1.3rem;
      font-weight: 700;
      border: 3px solid var(--border);
      border-radius: 16px;
      background: #fff;
      color: var(--text);
    }
    .answer-input:focus { border-color: var(--primary); outline: none; }
    .answer-input.correct { background: var(--correct-bg); border-color: var(--correct); }
    .answer-input.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
    .short-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .short-actions .btn { margin-top: 0; min-height: 64px; font-size: 1rem; }
    .hint {
      margin-top: 12px;
      padding: 12px 16px;
      background: #fff8e1;
      border: 2px dashed var(--focus);
      border-radius: 12px;
      font-weight: 700;
    }

    /* 정답/오답 안내 */
    .feedback {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      font-size: 1.1rem;
      display: none;
    }
    .feedback.show { display: block; animation: pop 0.35s ease-out; }
    .feedback.good { background: var(--correct-bg); border: 3px solid var(--correct); color: var(--correct); }
    .feedback.bad  { background: var(--wrong-bg);  border: 3px solid var(--wrong);  color: var(--wrong); }
    .feedback .title { font-size: 1.4rem; font-weight: 900; margin-bottom: 6px; }
    .feedback .explain { color: var(--text); margin-top: 8px; }

    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .btn {
      display: block;
      width: 100%;
      min-height: 72px;
      margin-top: 24px;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: #fff; color: var(--primary-dark); border: 3px solid var(--primary); }
    .btn.secondary:hover { background: var(--primary-soft); }
    .hidden { display: none !important; }

    /* 시작/결과 화면 */
    .center { text-align: center; }
    .big-emoji { font-size: 4rem; line-height: 1.2; }
    .intro p { font-size: 1.05rem; margin: 8px 0; }
    .score { font-size: 2.6rem; font-weight: 900; color: var(--primary-dark); margin: 8px 0; }
    .result-msg { font-size: 1.25rem; font-weight: 700; }

    .review { margin-top: 28px; text-align: left; }
    .review h2 { font-size: 1.2rem; }
    .review-item {
      border-left: 6px solid var(--wrong);
      background: #fff7f7;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .review-item .q { font-weight: 700; }
    .review-item .a { color: var(--correct); font-weight: 700; margin-top: 4px; }

    /* 정답 시 축하 꽃가루 */
    .confetti {
      position: fixed;
      top: -20px;
      font-size: 1.6rem;
      pointer-events: none;
      animation: fall 1.6s linear forwards;
      z-index: 10;
    }
    @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .confetti { display: none; }
      .feedback.show { animation: none; }
    }

    @media (max-width: 520px) {
      html { font-size: calc(19px * var(--scale)); }
      .card { padding: 22px 16px; }
      .option { gap: 12px; padding: 12px 14px; }
      .choice-group { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>💻 바이브 코딩 복습 퀴즈</h1>
      <div class="size-controls" aria-label="글자 크기 조절">
        <span>글자 크기</span>
        <button class="size-btn" id="smaller" aria-label="글자 작게">가−</button>
        <button class="size-btn" id="bigger" aria-label="글자 크게">가+</button>
      </div>
    </div>

    <!-- 시작 화면 -->
    <section class="card center intro" id="startScreen">
      <div class="big-emoji">✏️</div>
      <h2 style="font-size:1.4rem;margin:8px 0 8px">바이브 코딩, 얼마나 기억하고 계신가요?</h2>
      <p>난이도와 문제 유형을 고른 뒤<br><strong>퀴즈 시작하기</strong>를 눌러 주세요.</p>

      <div class="setting">
        <h3>① 난이도를 골라 주세요</h3>
        <div class="choice-group" id="levelGroup" role="group" aria-label="난이도">
          <button class="choice" data-value="하" aria-pressed="true">하<small>쉬워요</small></button>
          <button class="choice" data-value="중" aria-pressed="false">중<small>보통이에요</small></button>
          <button class="choice" data-value="상" aria-pressed="false">상<small>어려워요</small></button>
        </div>
      </div>

      <div class="setting">
        <h3>② 문제 유형을 골라 주세요</h3>
        <div class="choice-group" id="typeGroup" role="group" aria-label="문제 유형">
          <button class="choice" data-value="mc" aria-pressed="true">객관식<small>보기 고르기</small></button>
          <button class="choice" data-value="short" aria-pressed="false">단답형<small>직접 쓰기</small></button>
          <button class="choice" data-value="mix" aria-pressed="false">섞어서<small>둘 다</small></button>
        </div>
      </div>

      <p style="color:var(--muted);margin-top:20px">틀려도 괜찮아요. 해설을 보며 다시 익히면 됩니다 😊</p>
      <button class="btn" id="startBtn">퀴즈 시작하기</button>
    </section>

    <!-- 문제 화면 -->
    <section class="card hidden" id="quizScreen" aria-live="polite">
      <div class="progress-text">
        <span id="progressText"></span>
        <span class="badge" id="modeBadge"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p class="question" id="questionText"></p>

      <!-- 객관식 -->
      <div class="options" id="options"></div>

      <!-- 단답형 -->
      <div class="short-box hidden" id="shortBox">
        <label for="answerInput">✍️ 정답을 적어 주세요</label>
        <input class="answer-input" id="answerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력">
        <div class="hint hidden" id="hintBox"></div>
        <button class="btn" id="submitBtn">정답 확인</button>
        <div class="short-actions">
          <button class="btn secondary" id="hintBtn">💡 힌트 보기</button>
          <button class="btn secondary" id="giveUpBtn">🙋 모르겠어요</button>
        </div>
      </div>

      <div class="feedback" id="feedback" role="status"></div>
      <button class="btn hidden" id="nextBtn">다음 문제 ▶</button>
    </section>

    <!-- 결과 화면 -->
    <section class="card center hidden" id="resultScreen">
      <div class="big-emoji" id="resultEmoji">🏆</div>
      <div class="badge" id="resultBadge" style="display:inline-block"></div>
      <div class="score" id="scoreText"></div>
      <p class="result-msg" id="resultMsg"></p>
      <div class="review" id="review"></div>
      <button class="btn" id="retryBtn">같은 설정으로 다시 풀기</button>
      <button class="btn secondary" id="homeBtn">난이도·유형 다시 고르기</button>
    </section>
  </div>

  <script>
    /* ================================================================
       ✍️ 문제를 바꾸고 싶으면 이 부분만 고치면 됩니다.
       - level   : 난이도 ("하", "중", "상") — 난이도마다 10문제씩
       - q       : 문제 (객관식·단답형 모두 같은 문제를 씁니다)
       - options : 객관식 보기 4개 — ⭐ 첫 번째에 정답을 적으세요.
                   (화면에서는 보기 순서가 자동으로 섞여서 나옵니다)
       - answers : 단답형에서 정답으로 인정할 말들
                   (띄어쓰기·대소문자·마침표는 무시하고 채점합니다.
                    첫 번째 말이 '정답'으로 화면에 보입니다)
       - explain : 해설
       ================================================================ */
    const QUESTIONS = [
      /* ---------------------- 난이도: 하 ---------------------- */
      {
        level: "하",
        q: "원하는 것을 말(글)로 설명하면 AI가 코드를 대신 작성해 주는 개발 방식을 무엇이라고 할까요?",
        options: ["바이브 코딩", "블록 코딩", "하드 코딩", "손 코딩"],
        answers: ["바이브 코딩", "바이브코딩", "vibe coding", "바이브"],
        explain: "바이브 코딩은 '이런 걸 만들어 줘'라고 말하면 AI가 코드를 짜 주는 방식입니다. 목수에게 '이런 의자를 만들어 주세요'라고 주문하는 것과 비슷해요."
      },
      {
        level: "하",
        q: "AI에게 일을 시킬 때 입력하는 '지시문'을 무엇이라고 부를까요?",
        options: ["프롬프트", "다운로드", "업데이트", "로그아웃"],
        answers: ["프롬프트", "prompt"],
        explain: "AI에게 건네는 요청 문장이 '프롬프트'입니다. 식당의 주문서처럼, 자세히 쓸수록 원하는 결과가 나와요."
      },
      {
        level: "하",
        q: "웹페이지의 '뼈대'(제목, 글, 버튼 같은 내용과 구조)를 만드는 언어는 무엇일까요?",
        options: ["HTML", "엑셀", "PDF", "MP3"],
        answers: ["HTML", "에이치티엠엘"],
        explain: "HTML은 집으로 치면 기둥과 벽 같은 뼈대입니다. 이번 퀴즈 앱도 index.html 파일 하나로 만들어졌어요."
      },
      {
        level: "하",
        q: "웹페이지의 색깔, 글꼴, 배치처럼 '꾸미는 일'을 담당하는 언어는 무엇일까요?",
        options: ["CSS", "HTML", "PDF", "ZIP"],
        answers: ["CSS", "씨에스에스"],
        explain: "CSS는 집의 벽지와 페인트, 인테리어에 해당합니다. 같은 뼈대(HTML)라도 CSS에 따라 전혀 다르게 보여요."
      },
      {
        level: "하",
        q: "버튼을 누르면 반응하는 것처럼, 웹페이지가 '움직이게' 만드는 언어는 무엇일까요?",
        options: ["자바스크립트", "CSS", "워드", "한글"],
        answers: ["자바스크립트", "javascript", "js", "자바 스크립트"],
        explain: "자바스크립트는 집의 전기 배선과 스위치 같은 역할입니다. 누르면 불이 켜지듯, 클릭하면 무언가 일어나게 해요."
      },
      {
        level: "하",
        q: "프로그램이 의도와 다르게 동작하는 '오류'를 흔히 무엇이라고 부를까요?",
        options: ["버그", "백업", "부팅", "버퍼"],
        answers: ["버그", "bug"],
        explain: "버그(bug)는 '벌레'라는 뜻으로, 프로그램 속 오류를 말합니다. 옛날 컴퓨터에 실제 나방이 끼어 고장 난 일화에서 유명해졌어요."
      },
      {
        level: "하",
        q: "프로그램 속 오류(버그)를 찾아서 고치는 일을 무엇이라고 할까요?",
        options: ["디버깅", "코딩 테스트", "다운로드", "로그인"],
        answers: ["디버깅", "debugging", "디버그", "debug"],
        explain: "디버깅은 '벌레(버그)를 잡는다'는 뜻입니다. 바이브 코딩에서는 오류 메시지를 AI에게 그대로 보여 주면 함께 고쳐 줘요."
      },
      {
        level: "하",
        q: "AI가 사실이 아닌 내용을 진짜처럼 그럴듯하게 지어내는 현상을 무엇이라고 할까요?",
        options: ["할루시네이션", "스트리밍", "백업", "버퍼링"],
        answers: ["할루시네이션", "환각", "hallucination", "할루시네이션(환각)"],
        explain: "AI가 모르는 것을 아는 척 지어내는 것을 '할루시네이션(환각)'이라고 합니다. AI가 만든 코드도 꼭 실행해 보고 확인해야 해요."
      },
      {
        level: "하",
        q: "내가 만든 웹사이트를 인터넷에 올려 다른 사람도 볼 수 있게 하는 것을 무엇이라고 할까요?",
        options: ["배포", "삭제", "압축", "인쇄"],
        answers: ["배포", "deploy", "디플로이", "배포하기"],
        explain: "배포(deploy)는 완성한 요리를 손님 식탁에 내놓는 것과 같습니다. 배포해야 다른 사람이 주소로 들어와 볼 수 있어요."
      },
      {
        level: "하",
        q: "Anthropic이 만든 AI 코딩 도구로, 말로 지시하면 직접 파일을 만들고 고쳐 주는 도구의 이름은?",
        options: ["Claude Code", "Claude Paint", "Claude Music", "Claude Mail"],
        answers: ["Claude Code", "클로드 코드", "클로드코드", "claudecode"],
        explain: "Claude Code는 대화로 지시하면 코드를 읽고, 만들고, 고쳐 주는 AI 코딩 도우미입니다. 바이브 코딩의 대표 도구예요."
      },

    /* ===================== 아래는 동작 코드 ===================== */
    const $ = (id) => document.getElementById(id);
    const TYPE_NAMES = { mc: "객관식", short: "단답형", mix: "섞어서" };

    let settings = { level: "하", type: "mc" };
    let quiz = [];        // 이번에 풀 문제 목록 [{item, mode, options}]
    let current = 0;
    let score = 0;
    let wrongList = [];
    let answered = false;

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    // 채점용: 띄어쓰기·대소문자·기호를 무시
    function normalize(s) {
      return String(s).toLowerCase().replace(/[\s.\-_·()\[\]'"`~!?,]/g, "");
    }

    function show(screen) {
      ["startScreen", "quizScreen", "resultScreen"].forEach((id) =>
        $(id).classList.toggle("hidden", id !== screen)
      );
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 시작 화면의 선택 버튼(난이도·유형)
    function setupChoiceGroup(groupId, key) {
      const buttons = $(groupId).querySelectorAll(".choice");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true");
          settings[key] = btn.dataset.value;
        });
      });
    }

    function startQuiz() {
      const pool = shuffle(QUESTIONS.filter((x) => x.level === settings.level));
      // '섞어서'는 객관식·단답형이 반반 나오도록
      const modes = pool.map((_, i) =>
        settings.type === "mix" ? (i % 2 === 0 ? "mc" : "short") : settings.type
      );
      const mixedModes = settings.type === "mix" ? shuffle(modes) : modes;
      quiz = pool.map((item, i) => ({
        item,
        mode: mixedModes[i],
        options: shuffle(item.options)
      }));
      current = 0; score = 0; wrongList = [];
      $("modeBadge").textContent = `난이도 ${settings.level} · ${TYPE_NAMES[settings.type]}`;
      show("quizScreen");
      renderQuestion();
    }

    function renderQuestion() {
      const { item, mode, options } = quiz[current];
      answered = false;
      $("progressText").textContent = `${current + 1}번 문제 / 전체 ${quiz.length}문제`;
      $("progressFill").style.width = `${(current / quiz.length) * 100}%`;
      $("questionText").textContent = `Q${current + 1}. ${item.q}`;

      const box = $("options");
      box.innerHTML = "";
      box.classList.toggle("hidden", mode !== "mc");
      $("shortBox").classList.toggle("hidden", mode !== "short");

      if (mode === "mc") {
        options.forEach((text, i) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.innerHTML = `<span class="num">${i + 1}</span><span></span>`;
          btn.lastChild.textContent = text;
          btn.addEventListener("click", () => chooseOption(text, btn));
          box.appendChild(btn);
        });
      } else {
        const input = $("answerInput");
        input.value = "";
        input.className = "answer-input";
        input.disabled = false;
        $("hintBox").classList.add("hidden");
        ["submitBtn", "hintBtn", "giveUpBtn"].forEach((id) => {
          $(id).disabled = false;
          $(id).classList.remove("hidden");
        });
        $("hintBtn").parentElement.classList.remove("hidden");
        setTimeout(() => input.focus({ preventScroll: true }), 50);
      }

      const fb = $("feedback");
      fb.className = "feedback";
      fb.innerHTML = "";
      $("nextBtn").classList.add("hidden");
    }

    // 객관식 채점
    function chooseOption(text, clicked) {
      if (answered) return;
      const { item } = quiz[current];
      const correctText = item.options[0];
      const buttons = [...$("options").children];
      let correctNum = 0;
      buttons.forEach((b, i) => {
        b.disabled = true;
        if (b.lastChild.textContent === correctText) { b.classList.add("correct"); correctNum = i + 1; }
        else if (b !== clicked) b.classList.add("dim");
      });
      const ok = text === correctText;
      if (!ok) clicked.classList.add("wrong");
      finish(ok, `정답은 <strong>${correctNum}번</strong> 입니다.`);
    }

    // 단답형 채점
    function submitShort(giveUp) {
      if (answered) return;
      const { item } = quiz[current];
      const input = $("answerInput");
      const value = input.value.trim();
      if (!giveUp && !value) {
        input.focus();
        input.placeholder = "정답을 먼저 적어 주세요";
        return;
      }
      const ok = !giveUp && item.answers.some((a) => normalize(a) === normalize(value));
      input.disabled = true;
      input.classList.add(ok ? "correct" : "wrong");
      ["submitBtn", "hintBtn", "giveUpBtn"].forEach((id) => ($(id).disabled = true));
      $("submitBtn").classList.add("hidden");
      $("hintBtn").parentElement.classList.add("hidden");
      finish(ok, `정답은 <strong></strong> 입니다.`, item.answers[0]);
    }

    function showHint() {
      const answer = item0Answer();
      const letters = answer.replace(/\s/g, "");
      $("hintBox").textContent = `💡 힌트: 첫 글자는 '${letters[0]}', 모두 ${letters.length}글자예요 (띄어쓰기 빼고)`;
      $("hintBox").classList.remove("hidden");
    }
    function item0Answer() { return quiz[current].item.answers[0]; }

    // 정답/오답 공통 처리
    function finish(ok, wrongHtml, answerText) {
      answered = true;
      const { item } = quiz[current];
      const fb = $("feedback");
      if (ok) {
        score++;
        fb.className = "feedback show good";
        fb.innerHTML = `<div class="title">⭕ ${pick(PRAISES)}</div>`;
        celebrate();
      } else {
        wrongList.push(current);
        fb.className = "feedback show bad";
        fb.innerHTML = `<div class="title">❌ ${pick(ENCOURAGES)}</div><div>${wrongHtml}</div>`;
        if (answerText) fb.querySelector("strong").textContent = answerText;
      }
      const ex = document.createElement("div");
      ex.className = "explain";
      ex.textContent = "💡 " + item.explain;
      fb.appendChild(ex);

      const next = $("nextBtn");
      next.textContent = current === quiz.length - 1 ? "결과 보기 🏁" : "다음 문제 ▶";
      next.classList.remove("hidden");
      next.focus({ preventScroll: true });
      fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function nextQuestion() {
      current++;
      if (current < quiz.length) {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        showResult();
      }
    }

    function showResult() {
      const total = quiz.length;
      $("resultBadge").textContent = `난이도 ${settings.level} · ${TYPE_NAMES[settings.type]}`;
      $("scoreText").textContent = `${total}문제 중 ${score}문제 정답!`;
      let emoji, msg;
      if (score === total) { emoji = "🏆"; msg = "만점입니다! 바이브 코딩 내용을 완벽하게 익히셨어요. 정말 대단하세요!"; }
      else if (score >= total * 0.8) { emoji = "🌟"; msg = "아주 훌륭해요! 거의 다 맞히셨어요. 틀린 문제만 한 번 더 보면 완벽해요."; }
      else if (score >= total * 0.5) { emoji = "👍"; msg = "잘하셨어요! 절반 넘게 맞히셨네요. 아래 문제를 다시 살펴볼까요?"; }
      else { emoji = "🌱"; msg = "수고 많으셨어요! 복습은 지금부터가 시작이에요. 한 번 더 풀어 보면 훨씬 쉬워질 거예요."; }
      if (score === total && settings.level !== "상") {
        msg += ` 다음엔 난이도 '${settings.level === "하" ? "중" : "상"}'에 도전해 보세요!`;
      }
      $("resultEmoji").textContent = emoji;
      $("resultMsg").textContent = msg;

      const review = $("review");
      review.innerHTML = "";
      if (wrongList.length) {
        const h = document.createElement("h2");
        h.textContent = "📝 다시 보면 좋은 문제";
        review.appendChild(h);
        wrongList.forEach((idx) => {
          const { item } = quiz[idx];
          const div = document.createElement("div");
          div.className = "review-item";
          const q = document.createElement("div");
          q.className = "q";
          q.textContent = `Q${idx + 1}. ${item.q}`;
          const a = document.createElement("div");
          a.className = "a";
          a.textContent = `정답: ${item.options[0]}`;
          const e = document.createElement("div");
          e.textContent = "💡 " + item.explain;
          div.append(q, a, e);
          review.appendChild(div);
        });
      }
      show("resultScreen");
      if (score === total) { celebrate(); setTimeout(celebrate, 600); }
    }

    function celebrate() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const pieces = ["🎉", "⭐", "👏", "✨", "🌸"];
      for (let i = 0; i < 18; i++) {
        const s = document.createElement("span");
        s.className = "confetti";
        s.textContent = pick(pieces);
        s.style.left = Math.random() * 100 + "vw";
        s.style.animationDelay = Math.random() * 0.4 + "s";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 2200);
      }
    }

    // 글자 크기 조절 (선택한 크기는 이 기기에 기억됨)
    let scale = 1;
    try { scale = parseFloat(localStorage.getItem("quizScale")) || 1; } catch (e) {}
    function applyScale() {
      document.documentElement.style.setProperty("--scale", scale);
      try { localStorage.setItem("quizScale", scale); } catch (e) {}
    }
    $("bigger").addEventListener("click", () => { scale = Math.min(1.5, +(scale + 0.1).toFixed(1)); applyScale(); });
    $("smaller").addEventListener("click", () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(1)); applyScale(); });
    applyScale();

    setupChoiceGroup("levelGroup", "level");
    setupChoiceGroup("typeGroup", "type");
    $("startBtn").addEventListener("click", startQuiz);
    $("nextBtn").addEventListener("click", nextQuestion);
    $("retryBtn").addEventListener("click", startQuiz);
    $("homeBtn").addEventListener("click", () => show("startScreen"));
    $("submitBtn").addEventListener("click", () => submitShort(false));
    $("giveUpBtn").addEventListener("click", () => submitShort(true));
    $("hintBtn").addEventListener("click", showHint);
    // 엔터 키로 정답 확인 (한글 입력 중에는 무시)
    $("answerInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); submitShort(false); }
    });
  </script>
</body>
</html>
